<!doctype html>
<html lang="cs" data-mode="public">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Růst Plzně 1295–2020</title>
  <style>
    html, body { margin: 0; height: 100%; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; color: #1f2427; background: #dfe6ea; overflow: hidden }
    #g3d { position: fixed; inset: 0 }
    .bar { position: fixed; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      background: rgba(251,251,250,.92); border: 1px solid #d3d8d6; border-radius: 6px; padding: 6px 10px }
    .bar label { display: inline-flex; gap: 6px; align-items: center }
    .top { left: 10px; top: 10px; max-width: calc(100% - 40px) }
    #legend { left: 10px; top: 52px; flex-direction: column; align-items: flex-start; gap: 3px; font-size: 12px }
    #legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -2px; border: 1px solid rgba(0,0,0,.15) }
    .bottom { left: 10px; right: 10px; bottom: 10px; flex-wrap: nowrap }
    .year { font: 700 28px/1 "Segoe UI", system-ui, sans-serif; min-width: 70px; text-align: center; font-variant-numeric: tabular-nums }
    .tl { position: relative; flex: 1; height: 44px; min-width: 120px }
    .tl canvas { position: absolute; inset: 0 0 14px 0; width: 100%; height: 30px }
    .tl input { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; margin: 0 }
    #caption { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); max-width: min(720px, 70vw); text-align: center;
      font: 600 17px/1.35 "Segoe UI", system-ui, sans-serif; background: rgba(31,36,39,.78); color: #fff; padding: 8px 14px; border-radius: 6px;
      transition: opacity .3s; pointer-events: none; margin-top: 44px }
    #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden }
    .vlabel { position: absolute; left: 0; top: 0; font: 600 12px system-ui; color: #1f2427; text-shadow: 0 0 3px #fff, 0 0 3px #fff; white-space: nowrap; margin: -8px 0 0 -20px }
    .muted { color: #66707a }
    #vpanel { display: none; position: fixed; left: 0; top: 46px; bottom: 66px; width: 46%; background: #f6f6f4; border-right: 1px solid #d3d8d6; flex-direction: column; z-index: 2 }
    body.vmode #vpanel { display: flex }
    body.vmode #g3d { left: 46% }
    body.vmode #legend, body.vmode #caption { display: none }
    .vhead { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 6px 10px; border-bottom: 1px solid #d3d8d6 }
    .vimg { position: relative; flex: 1; overflow: auto }
    .vimg img { display: block; width: 100% }
    .vimg canvas { position: absolute; left: 0; top: 0; cursor: crosshair }
    .vhelp { padding: 6px 10px; font-size: 12px; border-top: 1px solid #d3d8d6 }
    .vlabel.lm { color: #7a2e8c }
    button { font: inherit }
    #gsel { max-width: 260px }
    #tlpanel { position: fixed; right: 10px; top: 56px; bottom: 76px; width: min(330px, 40vw); overflow: auto; background: rgba(251,251,250,.92);
      border: 1px solid #d3d8d6; border-radius: 6px; padding: 8px 10px; font-size: 12.5px }
    #tlpanel ol { list-style: none; margin: 6px 0 0; padding: 0 } #tlpanel li { padding: 3px 4px; border-radius: 4px; cursor: pointer }
    #tlpanel li:hover { background: #ebe8df } #tlpanel li.on { background: #f4dfc9 } #tlpanel b { color: #8c3b2e }
    #ginfo { position: fixed; left: 10px; bottom: 70px; background: rgba(31,36,39,.78); color: #fff; padding: 4px 10px; border-radius: 5px; font-size: 12.5px; max-width: 60vw }
    @media (max-width: 700px) { #tlpanel { display: none } }
    @media (max-width: 700px) { .bottom { flex-wrap: wrap } #legend { display: none } }
  </style>
</head>
<body>
  <script type="module" src="/src/growth3d.ts"></script>
</body>
</html>
